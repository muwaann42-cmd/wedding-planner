# ==============================================================================
# Cloudflare Pages / Workers Configuration — Lumière & Co. Wedding Planner
# ==============================================================================

name = "wedding-planner"
compatibility_date = "2024-10-01"
pages_build_output_dir = "."

# Cloudflare D1 Database Binding
# In Cloudflare Dashboard: Pages > Settings > Functions > D1 Database Bindings
# Variable name: DB
[[d1_databases]]
binding = "DB"
database_name = "wedding-planner-db"
database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"
